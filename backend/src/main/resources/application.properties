spring.application.name=ECom


# Load .env file properly (built-in Spring Boot feature)
spring.config.import=optional:file:.env[.properties]


# DATABASE CONNECTION (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/ecom?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# JPA / HIBERNATE SETTINGS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# JWT SETTINGS
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000


# PERFORMANCE (Spring Boot 4.1 / Java 21)
# Enables Java 21 Virtual Threads for massive performance improvements
spring.threads.virtual.enabled=true

# CORS SETTINGS
app.cors.allowed-origins=http://localhost:5173

# MAIL SETTINGS (Gmail via Jakarta Mail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Frontend base URL (used in email reset link)
app.frontend.url=http://localhost:5173
