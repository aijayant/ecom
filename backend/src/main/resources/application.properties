spring.application.name=ECom

# ===============================
# DATABASE CONNECTION (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/ecom?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===============================
# JPA / HIBERNATE SETTINGS
# ===============================
# 'update' automatically creates/updates tables based on your Java Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# ===============================
# JWT SETTINGS
# ===============================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000
# ===============================
# PERFORMANCE (Spring Boot 4.1 / Java 21)
# ===============================
# Enables Java 21 Virtual Threads for massive performance improvements
spring.threads.virtual.enabled=true